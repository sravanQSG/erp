services:
  postgres:
    image: postgres:16-alpine
    container_name: demo-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_app
      POSTGRES_PASSWORD: erp_app_dev_pw
      POSTGRES_DB: erp_dev
    ports:
      - '5432:5432'
    volumes:
      - demo-erp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_app -d erp_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  demo-erp-postgres-data:
